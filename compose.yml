x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://contestly:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/contestly
  APP_ENV: production
  PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
  AUTO_INIT_DB: 'false'
  SEED_SNAPSHOT: 'false'
  CONTEST_DATA_DIR: /app/runtime/catalogue

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: contestly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: contestly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U contestly -d contestly']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: contestly:local
    environment: *app-env
    volumes:
      - catalogue:/app/runtime/catalogue
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    image: contestly:local
    entrypoint: [python, -m, backend.manage, schedule]
    environment: *app-env
    volumes:
      - catalogue:/app/runtime/catalogue
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: contestly:local
    entrypoint: [python, -m, backend.manage, backup-schedule, --directory, /backups]
    environment: *app-env
    volumes:
      - database_backups:/backups
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  catalogue:
  database_backups:
  caddy_data:
  caddy_config:
